<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ausbildungs-Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="fragen.js"></script>

</head>
<body>
  <div class="quiz-container">
    <!-- Start Screen -->
    <div id="start-screen">
      <div class="quiz-header">
        <h1>📚 Ausbildungs-Quiz</h1>
        <p style="color: var(--gray-600); margin-top: 8px;">Teste dein Wissen zur Berufsausbildung und Personalplanung</p>
      </div>
      <div style="text-align:center; margin: 24px 0;">
        <p style="color: var(--gray-600);">🔢 <strong>20 Fragen</strong> (zufällig ausgewählt)</p>
        <p style="color: var(--gray-600); margin-top: 8px;">☑️ Multiple Choice (auch Mehrfachauswahl)</p>
        <p style="color: var(--gray-600); margin-top: 8px;">🔀 Aus <span id="total-questions"></span> verfügbaren Fragen</p>
      </div>
      <button class="btn btn-primary" onclick="startQuiz()">Quiz starten</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
      <div class="quiz-header">
        <h1>📚 Ausbildungs-Quiz</h1>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="question-counter" id="question-counter"></div>
      </div>
      <div class="question-text" id="question-text"></div>
      <div class="answer-hint" id="answer-hint"></div>
      <div class="options" id="options"></div>
      <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()" disabled>Antwort überprüfen</button>
      <button class="btn btn-primary hidden" id="next-btn" onclick="nextQuestion()">Nächste Frage →</button>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="hidden"></div>
  </div>

  <script>

    let shuffledQuestions = [];
    let currentIndex = 0;
    let selectedOptions = [];
    let score = 0;
    let results = [];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startQuiz() {
      shuffledQuestions = shuffle(questions).slice(0, 20);
      currentIndex = 0;
      score = 0;
      results = [];
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = shuffledQuestions[currentIndex];
      
      // 👇 Add this line to shuffle the answers for this question
      q.options = shuffle(q.options); 

      selectedOptions = new Array(q.options.length).fill(false);

      document.getElementById('question-counter').textContent = `Frage ${currentIndex + 1} von ${shuffledQuestions.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIndex) / shuffledQuestions.length) * 100}%`;
      document.getElementById('question-text').textContent = q.question;
      document.getElementById('answer-hint').textContent = `${q.answersNeeded} Antwort${q.answersNeeded > 1 ? 'en' : ''} auswählen`;

      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.dataset.index = i;
        div.innerHTML = `<div class="checkbox"></div><div class="option-label">${opt.text}</div>`;
        div.addEventListener('click', () => toggleOption(i, div));
        optionsContainer.appendChild(div);
      });

      document.getElementById('submit-btn').classList.remove('hidden');
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('next-btn').classList.add('hidden');
    }

    function toggleOption(index, el) {
      selectedOptions[index] = !selectedOptions[index];
      el.classList.toggle('selected', selectedOptions[index]);

      const q = shuffledQuestions[currentIndex];
      const selectedCount = selectedOptions.filter(Boolean).length;
      document.getElementById('submit-btn').disabled = selectedCount < q.answersNeeded;
    }

    function submitAnswer() {
      const q = shuffledQuestions[currentIndex];
      const optionEls = document.querySelectorAll('.option');
      let allCorrect = true;

      optionEls.forEach((el, i) => {
        el.classList.add('disabled');
        const isCorrect = q.options[i].correct;
        const isSelected = selectedOptions[i];

        if (isCorrect && isSelected) {
          el.classList.add('correct');
        } else if (isCorrect && !isSelected) {
          el.classList.add('correct');
          allCorrect = false;
        } else if (!isCorrect && isSelected) {
          el.classList.add('wrong');
          allCorrect = false;
        }
      });

      if (allCorrect) score++;
      results.push({ question: q.question, correct: allCorrect });

      document.getElementById('submit-btn').classList.add('hidden');
      const nextBtn = document.getElementById('next-btn');
      nextBtn.classList.remove('hidden');
      nextBtn.textContent = currentIndex < shuffledQuestions.length - 1 ? 'Nächste Frage →' : 'Ergebnisse anzeigen';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < shuffledQuestions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      const screen = document.getElementById('results-screen');
      screen.classList.remove('hidden');

      const pct = Math.round((score / shuffledQuestions.length) * 100);
      let icon = '🎉', msg = 'Ausgezeichnet!';
      if (pct < 100) { icon = '👍'; msg = 'Gut gemacht!'; }
      if (pct < 50) { icon = '📖'; msg = 'Noch etwas üben!'; }

      let reviewHTML = results.map((r, i) => `
        <div class="review-item ${r.correct ? 'review-correct' : 'review-wrong'}">
          <div class="review-q">${r.correct ? '✅' : '❌'} ${r.question}</div>
          <div class="review-a">${r.correct ? 'Korrekt beantwortet' : 'Falsch beantwortet'}</div>
        </div>
      `).join('');

      screen.innerHTML = `
        <div class="results">
          <div class="results-icon">${icon}</div>
          <h2>${msg}</h2>
          <div class="score">${score}/${shuffledQuestions.length}</div>
          <div class="score-detail">${pct}% richtig</div>
          <div class="review-section">${reviewHTML}</div>
          <button class="btn btn-primary" onclick="restartQuiz()" style="margin-top:24px;">Nochmal spielen 🔄</button>
        </div>
      `;
    }

    function restartQuiz() {
      document.getElementById('results-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
      updateQuestionCount();
    }


    function updateQuestionCount() {
      document.querySelector('#start-screen strong').textContent = '2 Fragen';
      const totalEl = document.getElementById('total-questions');
      if (totalEl) totalEl.textContent = questions.length;
    }

    // Update count on page load
    updateQuestionCount();
  </script>
</body>
</html>
